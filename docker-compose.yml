services:
  aistudio-api:
    build: .
    container_name: aistudio-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${AISTUDIO_BIND_ADDRESS:-127.0.0.1}:${AISTUDIO_PORT:-8080}:${AISTUDIO_PORT:-8080}"
    volumes:
      - ./data:/app/data           # Account data, stats.json and rotator_state.json persistence
      - ./config.yaml:/app/data/config.yaml  # Model configuration file
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${AISTUDIO_PORT:-8080}/v1beta/models || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
